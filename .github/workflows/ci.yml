name: CI

# 跑什么：14 个自动化套件（逐条计数，共 166 条用例，具体条数以各文件输出为准）+ dev 集 72 题 + 留出集 31 题。
# 都不需要 Ollama——测试里对大模型的调用一律打桩，见 CLAUDE.md 的铁律三。
#
# ⚠️ 覆盖缺口（明确降级声明，不是疏忽）：端到端 / 提示词层不在这里跑。
# run_eval.py 只用 --no-llm，只查检索与判定规则；第二层要真起 Ollama 才能测
# "模型会不会先追问、会不会把库外法规当成标准原文"，CI runner 上没有 Ollama。
# 本地发版前必须手工跑一次不带 --no-llm 的 `python tests/run_eval.py`
# （退出码 3 = 第二层应跑未跑，不算达标），并把结果贴进 devlog。
#
# 需要联网的只有一处：fastembed 要下载语义模型（BAAI/bge-small-zh-v1.5，约 95 MB）。
# 用 actions/cache 缓存 data/models，正常情况下只在缓存过期时下一次。
#
# action 版本：2026-10 升到 checkout@v7 / setup-python@v7 / setup-node@v7 / cache@v6，
# 旧版跑在 Node 20 运行时上，GitHub 会强制迁到 Node 24 并出告警。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同分支连续推送时取消上一次还没跑完的，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 后端套件（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂了不要掐掉另一个——两个平台的结果都有用
      fail-fast: false
      matrix:
        # Windows 是本项目的主要目标平台（用户双击 .bat 启动），
        # 所以两个都跑：ubuntu 快，windows 才是真实环境。
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"      # 与开发机 .venv 保持一致
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "22"          # tests/check_syntax.py 要用 node --check 校验 JS

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 缓存语义模型
        uses: actions/cache@v6
        with:
          path: data/models
          key: fastembed-${{ runner.os }}-bge-small-zh-v1.5

      - name: 建知识库与检索索引
        # 全新检出时 data/app.db 不存在，这一步会从 data/seed 导入 283 条种子条款
        # 并建好全文索引与语义向量。没有这一步，后面所有需要知识库的套件都会失败。
        env:
          # 开发机在国内，默认走 hf-mirror.com；GitHub runner 上官方源更快更稳
          HF_MIRROR: https://huggingface.co
        run: python tools/build_index.py

      - name: 静态检查（最先跑）
        run: python tests/check_syntax.py

      - name: 检索与判定质量（dev 集 72 题，不上大模型；端到端不在此运行）
        env:
          HF_MIRROR: https://huggingface.co
        run: python tests/run_eval.py --no-llm

      - name: 留出集纪律检查（防过拟合）
        # 跑留出集 31 题，并校验指纹锁、与 dev 集的零重叠、基准棘轮。
        # 它的意义不是"再跑一遍评测"，而是保证那把没被调过参的尺子还在。
        env:
          HF_MIRROR: https://huggingface.co
        run: python tests/test_eval_discipline.py

      - name: 分词与口语映射
        run: python tests/test_normalize.py

      - name: 问题范围判定
        run: python tests/test_scope.py

      - name: 风险判定与库外转述清理
        run: python tests/test_guard.py

      - name: 异常路径
        run: python tests/test_edge_cases.py

      - name: 质量自检三态与版本号单一来源
        # 钉住"自检自己崩了"这条最不该骗人的路径：passed 必须是三态
        # （True/False/None），崩溃时是 None 而不是 True。也钉住 openapi 与
        # /api/health 的版本号来自同一处 config.APP_VERSION。
        run: python tests/test_quality_gate.py

      - name: 等级判定矩阵（锚点闭集 + 回答侧兜底）
        # t20 新增这一套时只写进了本机命令清单，漏了 ci.yml——和 test_quality_gate.py
        # 当初漏掉是同一个病：不进 CI 的回归测试等于不存在。它用 llm_calls==0 打桩，
        # 不需要 Ollama，240 句矩阵是运行时现算的，整份都在 runner 上跑。
        run: python tests/test_level_denial.py

      - name: 服务端答案拼装与概述过滤
        # 答案正文由 app/answer.py 拼装，模型只输出结构化字段。这一套钉住两件事：
        # ①概述（summary）命中等级/档位/第二人称/判定词就整条丢弃，条款清单照常渲染；
        # ②接地判据——概述的实词必须与被引条款有交集，空话不许混进来。
        # 它同时是"过滤掉了也不能让答案少东西"的守卫，所以放在等级矩阵之后。
        run: python tests/test_answer_render.py

      - name: 导入与撤销
        run: python tests/test_revert.py

      - name: 流式输出
        run: python tests/test_streaming.py

      - name: Word 导出
        run: python tests/test_export.py

      - name: 开发日志读写
        # 用临时目录，不碰仓库里的 devlog/（否则 CI 会把日志改脏）
        run: python tests/test_devlog.py

  frontend:
    name: 界面回归（真 Chrome + axe-core）
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 缓存语义模型
        uses: actions/cache@v6
        with:
          path: data/models
          key: fastembed-${{ runner.os }}-bge-small-zh-v1.5

      - name: 建知识库与检索索引
        env:
          HF_MIRROR: https://huggingface.co
        run: python tools/build_index.py

      - name: 确认 Chrome 可用
        # ubuntu-latest 的镜像自带 Google Chrome；tools/cdp_eval.js 会去找
        # /usr/bin/google-chrome。如果哪天镜像不再自带，这一步会立刻暴露出来，
        # 而不是让前端套件报一个看不懂的错。
        run: google-chrome --version

      - name: 界面回归测试
        run: python tests/test_frontend.py
